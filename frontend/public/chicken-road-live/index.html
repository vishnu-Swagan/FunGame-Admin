<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0705" />
  <title>Chicken Road - Chakri.Casino</title>
  <style>
    :root {
      --bg: #0a0705;
      --panel: #140d08;
      --panel-2: #1c130a;
      --gold: #ffd447;
      --gold-2: #ffb020;
      --gold-deep: #c98a1e;
      --maroon: #3d0f16;
      --maroon-2: #5c1520;
      --green: #2fd07a;
      --red: #ff5964;
      --text: #f4ead6;
      --muted: #b39a72;
      --line: rgba(255, 212, 71, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      overflow: hidden; overscroll-behavior: none; user-select: none;
    }
    #app { display: flex; flex-direction: column; height: 100dvh; width: 100vw; }

    /* ---- header ---- */
    header {
      display: flex; align-items: center; gap: 12px; padding: 8px 14px;
      background: linear-gradient(180deg, #170f09, #0d0806);
      border-bottom: 1px solid var(--line); flex: 0 0 auto; min-height: 52px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 0.5px; }
    .brand .mark {
      width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep));
      display: grid; place-items: center; color: #2a1a05; font-weight: 900; font-size: 15px;
      box-shadow: 0 0 14px rgba(255, 176, 32, 0.5);
    }
    .brand .name { font-size: 13px; color: var(--gold); }
    .brand .name small { display: block; color: var(--muted); font-size: 9px; letter-spacing: 2px; }
    .title {
      flex: 1; text-align: center; font-weight: 900; letter-spacing: 3px;
      font-size: clamp(15px, 2.6vw, 24px);
      color: var(--gold);
      text-shadow: 0 0 18px rgba(255, 176, 32, 0.45);
    }
    .title span { color: var(--muted); font-weight: 700; }
    .hud { display: flex; align-items: center; gap: 10px; }
    .balance {
      text-align: right; line-height: 1.05;
    }
    .balance .lbl { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); }
    .balance .val { font-size: 16px; font-weight: 800; color: var(--gold); }
    button {
      font-family: inherit; color: var(--text); cursor: pointer; border: 0;
      background: transparent;
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--gold);
    }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ---- history pills ---- */
    .history {
      display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; flex: 0 0 auto;
      background: #0d0806; border-bottom: 1px solid var(--line); scrollbar-width: none;
    }
    .history::-webkit-scrollbar { display: none; }
    .pill {
      flex: 0 0 auto; font-size: 12px; font-weight: 800; padding: 4px 10px;
      border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid transparent;
    }
    .pill.low { color: var(--green); border-color: rgba(47,208,122,0.3); }
    .pill.mid { color: var(--gold); border-color: rgba(255,212,71,0.3); }
    .pill.high { color: var(--red); border-color: rgba(255,89,100,0.35); }

    /* ---- stage ---- */
    .stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #05060a; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .mult-wrap {
      position: absolute; top: 16%; left: 0; right: 0; text-align: center; pointer-events: none;
    }
    .mult {
      font-size: clamp(44px, 12vw, 120px); font-weight: 900; letter-spacing: 1px;
      color: var(--gold);
      text-shadow: 0 0 26px rgba(255,176,32,0.65), 0 0 60px rgba(255,176,32,0.35);
      transition: color 0.15s;
    }
    .mult.crashed { color: var(--red); text-shadow: 0 0 30px rgba(255,89,100,0.7); }
    .phase-label {
      margin-top: 2px; font-size: clamp(11px, 2vw, 15px); letter-spacing: 3px;
      color: var(--muted); text-transform: uppercase;
    }
    .phase-label.hit { color: var(--red); font-weight: 800; }

    .feed {
      position: absolute; top: 8px; right: 8px; width: min(30%, 190px);
      display: flex; flex-direction: column; gap: 5px; pointer-events: none; max-height: 62%;
      overflow: hidden;
    }
    .feed-row {
      display: flex; align-items: center; gap: 6px; font-size: 11px;
      background: rgba(10,7,5,0.62); border: 1px solid var(--line); border-radius: 8px;
      padding: 4px 7px; backdrop-filter: blur(3px);
    }
    .feed-row .who { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-row .mx { color: var(--gold); font-weight: 800; }
    .feed-row.lost .mx { color: var(--muted); }
    .feed-row .amt { color: var(--green); font-weight: 700; }

    .stage-controls { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; }
    .playing-now {
      position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: var(--muted);
      background: rgba(10,7,5,0.6); border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 10px; display: flex; align-items: center; gap: 6px;
    }
    .playing-now b { color: var(--gold); }

    .cashout-pop {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%) scale(0.6);
      opacity: 0; pointer-events: none; text-align: center;
      font-weight: 900; color: var(--gold); font-size: clamp(22px, 6vw, 48px);
      text-shadow: 0 0 24px rgba(255,176,32,0.7);
    }
    .cashout-pop.show { animation: pop 1.5s ease-out forwards; }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%,-60%) scale(1.1); }
      70% { opacity: 1; transform: translate(-50%,-70%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-90%) scale(0.95); }
    }

    /* ---- bet panels ---- */
    .panels {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px;
      background: linear-gradient(180deg, #0d0806, #140d08);
      border-top: 1px solid var(--line); flex: 0 0 auto;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 8px; display: flex; flex-direction: column; gap: 7px;
    }
    .modes { display: flex; gap: 5px; }
    .modes .mode {
      flex: 1; padding: 6px; border-radius: 8px; font-size: 12px; font-weight: 800;
      color: var(--muted); background: var(--panel-2); border: 1px solid transparent;
      min-height: 32px; letter-spacing: 1px;
    }
    .modes .mode.active { color: #2a1a05; background: linear-gradient(180deg, var(--gold), var(--gold-2)); }
    .bet-row { display: flex; align-items: center; gap: 8px; }
    .stepper {
      display: flex; align-items: center; gap: 6px; background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; flex: 1;
    }
    .stepper .amt-lbl { font-size: 8px; color: var(--muted); letter-spacing: 1px; position: absolute; }
    .stepper input {
      flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text);
      font-size: 18px; font-weight: 800; text-align: center; outline: none; font-family: inherit;
    }
    .step-btn {
      width: 34px; height: 34px; border-radius: 8px; background: #241708; color: var(--gold);
      font-size: 20px; font-weight: 800; display: grid; place-items: center; flex: 0 0 auto;
    }
    .chips { display: flex; gap: 5px; }
    .chip {
      flex: 1; padding: 6px 0; border-radius: 8px; font-size: 12px; font-weight: 800;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); min-height: 32px;
    }
    .chip.active { color: var(--gold); border-color: var(--gold-2); }
    .auto-row { display: none; align-items: center; gap: 8px; }
    .auto-row.show { display: flex; }
    .auto-row label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }
    .auto-row .stepper { flex: 1; }
    .action {
      position: relative; width: 100%; min-height: 62px; border-radius: 12px;
      font-weight: 900; letter-spacing: 1px; font-size: 15px; color: #0c2415;
      background: linear-gradient(180deg, #43e28a, #24b56a);
      box-shadow: 0 6px 18px rgba(36,181,106,0.32); transition: transform 0.08s;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .action:active { transform: translateY(2px); }
    .action.cashout {
      color: #2a1a05; background: linear-gradient(180deg, var(--gold), var(--gold-2));
      box-shadow: 0 6px 18px rgba(255,176,32,0.4);
    }
    .action.cancel { color: var(--text); background: linear-gradient(180deg, #6a2530, #47141d); box-shadow: none; }
    .action.disabled { filter: grayscale(0.7) brightness(0.7); pointer-events: none; }
    .action .sub { font-size: 12px; font-weight: 800; opacity: 0.9; }
    .action .big { font-size: 18px; }

    .overlay-msg {
      position: absolute; inset: 0; display: none; place-items: center; text-align: center;
      background: rgba(5,4,3,0.85); z-index: 20; padding: 24px;
    }
    .overlay-msg.show { display: grid; }
    .overlay-msg .box { max-width: 340px; }
    .overlay-msg h2 { color: var(--gold); margin: 0 0 8px; }
    .overlay-msg p { color: var(--muted); font-size: 14px; }
    .toast {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      background: var(--maroon-2); color: var(--text); border: 1px solid var(--gold-2);
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      opacity: 0; transition: opacity 0.25s; z-index: 30; pointer-events: none; max-width: 90%;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 620px) {
      .panels { grid-template-columns: 1fr; }
      .panel.p2 { display: none; }
      .feed { width: 44%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cashout-pop.show { animation-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="mark">C</div>
        <div class="name">CHAKRI<small>.CASINO</small></div>
      </div>
      <div class="title">CHICKEN&nbsp;ROAD <span>&#9654;</span></div>
      <div class="hud">
        <div class="balance"><div class="lbl">BALANCE</div><div class="val" id="balance">&#8377; 0.00</div></div>
        <button class="icon-btn" id="exitBtn" title="Exit" aria-label="Exit to lounge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <div class="history" id="history" aria-label="Round history"></div>

    <div class="stage">
      <canvas id="scene"></canvas>
      <div class="mult-wrap">
        <div class="mult" id="mult">1.00x</div>
        <div class="phase-label" id="phaseLabel">PLACE YOUR BETS</div>
      </div>
      <div class="feed" id="feed" aria-label="Live cash-outs"></div>
      <div class="cashout-pop" id="cashoutPop"></div>
      <div class="stage-controls">
        <button class="icon-btn" id="muteBtn" title="Mute" aria-label="Toggle sound">
          <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          <svg id="soundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
        </button>
        <button class="icon-btn" id="fsBtn" title="Fullscreen" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="icon-btn" id="statsBtn" title="Stats" aria-label="Round stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>
        </button>
      </div>
      <div class="playing-now"><span>&#128100;</span> <b id="playingNow">0</b> playing</div>
      <div class="overlay-msg" id="statsPanel">
        <div class="box" id="statsBox"></div>
      </div>
      <div class="overlay-msg" id="authGate">
        <div class="box">
          <h2>Session needed</h2>
          <p>Return to the lounge and open Chicken Road from your Chakri.Casino account.</p>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="panels" id="panels"></div>
  </div>

  <script src="engine.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
