<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f3540" />
  <title>Chicken Road - Chakri.Casino</title>
  <style>
    :root {
      --dock: #2a2e36;
      --dock-2: #343942;
      --dock-3: #3d424c;
      --line: rgba(255,255,255,0.10);
      --text: #f4f6f8;
      --muted: #a8b0bc;
      --green: #3dcc6a;
      --green-2: #2daa54;
      --yellow: #f5c400;
      --yellow-2: #d4a800;
      --red: #e24b4b;
      --teal: #2ec4c6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: #5a6570; color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      overflow: hidden; overscroll-behavior: none; user-select: none;
    }
    #app {
      display: flex; flex-direction: column;
      height: 100dvh; width: 100vw; max-width: 520px; margin: 0 auto;
      background: #5a6570; position: relative;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px 6px; flex: 0 0 auto;
      background: linear-gradient(180deg, rgba(20,22,26,0.55), rgba(20,22,26,0.12));
      position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    }
    .back {
      width: 36px; height: 36px; border-radius: 8px; border: 0; cursor: pointer;
      background: var(--teal); color: #111; display: grid; place-items: center; flex: 0 0 auto;
    }
    .back svg { width: 18px; height: 18px; }
    .brand {
      flex: 1; font-weight: 900; letter-spacing: 0.6px; font-size: 13px; line-height: 1.15;
      text-shadow: 0 1px 4px rgba(0,0,0,0.55);
    }
    .brand .cas { font-size: 9px; letter-spacing: 1.6px; color: #dfe7ee; font-weight: 700; display: block; }
    .brand .title { font-size: 15px; }
    .brand .title em { font-style: normal; color: #ff4d4d; }
    .balance-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(20,22,26,0.72); border: 1px solid var(--line);
      border-radius: 999px; padding: 5px 10px; font-weight: 800; font-size: 14px;
    }
    .balance-pill .coin {
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      color: #222; font-size: 11px; font-weight: 900; display: grid; place-items: center;
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 8px; border: 0; cursor: pointer;
      background: rgba(20,22,26,0.55); color: #fff; display: grid; place-items: center;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    button { font-family: inherit; }

    .ticker {
      position: absolute; top: 52px; left: 10px; right: 10px; z-index: 6;
      display: flex; align-items: center; gap: 10px; font-size: 11px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7); pointer-events: none;
    }
    .ticker .live { font-weight: 800; }
    .ticker .online { display: flex; align-items: center; gap: 5px; color: #e8edf2; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3dcc6a; box-shadow: 0 0 8px #3dcc6a; }
    .win-row {
      position: absolute; top: 72px; left: 10px; z-index: 6;
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      background: rgba(20,22,26,0.55); border-radius: 8px; padding: 4px 8px;
      pointer-events: none; max-width: 70%;
    }
    .win-row .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
    .win-row .amt { color: #3dcc6a; font-weight: 800; }

    .stage { flex: 1 1 auto; min-height: 0; position: relative; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .win-pop, .crash-pop {
      position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(0.7);
      opacity: 0; pointer-events: none; z-index: 8; text-align: center;
      font-weight: 900; letter-spacing: 1px;
    }
    .win-pop.show { animation: pop 1.6s ease-out forwards; color: #fff;
      font-size: clamp(36px, 10vw, 64px); text-shadow: 0 0 22px rgba(61,204,106,0.9); }
    .win-pop .sub { display: block; font-size: 18px; color: var(--yellow); margin-top: 4px; }
    .crash-pop.show { animation: pop 1.2s ease-out forwards; color: #ff6b6b;
      font-size: clamp(28px, 8vw, 48px); text-shadow: 0 0 18px rgba(226,75,75,0.8); }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      18% { opacity: 1; transform: translate(-50%,-58%) scale(1.08); }
      70% { opacity: 1; transform: translate(-50%,-64%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-80%) scale(0.96); }
    }

    .dock {
      flex: 0 0 auto; background: var(--dock); border-radius: 18px 18px 0 0;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: 8px; z-index: 7;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.28);
    }
    .bet-row { display: flex; align-items: center; gap: 8px; }
    .minmax {
      flex: 0 0 auto; min-width: 58px; height: 40px; border: 0; border-radius: 8px;
      background: var(--dock-3); color: var(--text); font-weight: 800; font-size: 12px; cursor: pointer;
    }
    .amount {
      flex: 1; height: 40px; border-radius: 8px; background: var(--dock-2);
      display: grid; place-items: center; font-weight: 800; font-size: 20px;
      border: 1px solid var(--line);
    }
    .amount input {
      width: 100%; height: 100%; background: transparent; border: 0; outline: none;
      color: var(--text); font: inherit; text-align: center;
    }
    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .chip {
      height: 40px; border: 0; border-radius: 8px; background: var(--dock-3);
      color: var(--text); font-weight: 800; font-size: 13px; cursor: pointer;
    }
    .chip.active { outline: 2px solid var(--yellow); color: var(--yellow); }
    .diff-row { position: relative; }
    .diff {
      width: 100%; height: 40px; border: 0; border-radius: 8px;
      background: var(--dock-3); color: var(--text); font-weight: 800; font-size: 14px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px; cursor: pointer;
    }
    .diff-menu {
      display: none; position: absolute; left: 0; right: 0; bottom: 44px;
      background: var(--dock-2); border-radius: 10px; overflow: hidden;
      border: 1px solid var(--line); z-index: 9;
    }
    .diff-menu.open { display: block; }
    .diff-menu button {
      width: 100%; height: 40px; border: 0; background: transparent; color: var(--text);
      font-weight: 800; cursor: pointer; text-align: left; padding: 0 14px;
    }
    .diff-menu button:hover, .diff-menu button.active { background: var(--dock-3); color: var(--yellow); }

    .actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .actions.split { grid-template-columns: 1fr 1fr; }
    .action {
      height: 56px; border: 0; border-radius: 12px; cursor: pointer;
      font-weight: 900; font-size: 18px; letter-spacing: 0.4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .action.play, .action.go {
      background: linear-gradient(180deg, #4adf75, var(--green-2)); color: #fff;
      box-shadow: 0 6px 16px rgba(45,170,84,0.35);
    }
    .action.cashout {
      background: linear-gradient(180deg, #ffd84a, var(--yellow-2)); color: #2a2208;
      box-shadow: 0 6px 16px rgba(212,168,0,0.35); font-size: 15px;
    }
    .action.cashout .sub { font-size: 12px; font-weight: 800; }
    .action:disabled { filter: grayscale(0.5) brightness(0.7); pointer-events: none; }
    .action:active { transform: translateY(1px); }

    .menu {
      position: absolute; inset: 0; background: rgba(10,12,16,0.55);
      display: none; place-items: center; z-index: 20; padding: 24px;
    }
    .menu.show { display: grid; }
    .menu .box {
      width: min(340px, 92%); background: var(--dock); border-radius: 16px;
      padding: 16px; border: 1px solid var(--line);
    }
    .menu h2 { margin: 0 0 12px; font-size: 16px; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 700;
    }
    .switch {
      width: 44px; height: 24px; border-radius: 999px; background: #5a616c; border: 0; position: relative; cursor: pointer;
    }
    .switch.on { background: var(--green); }
    .switch i {
      position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: left 0.15s;
    }
    .switch.on i { left: 23px; }
    .menu .link {
      display: block; width: 100%; text-align: left; background: transparent; border: 0;
      color: var(--text); padding: 11px 0; font-weight: 700; cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .powered { margin: 12px 0 0; text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 0.6px; }
    .toast {
      position: absolute; left: 50%; bottom: 210px; transform: translateX(-50%);
      background: #6a2530; color: #fff; padding: 8px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.2s; z-index: 30;
      pointer-events: none; max-width: 90%;
    }
    .toast.show { opacity: 1; }
    .lane-tag {
      position: absolute; left: 50%; transform: translateX(-50%);
      background: #2b7de9; color: #fff; font-weight: 900; font-size: 13px;
      padding: 3px 10px; border-radius: 6px; pointer-events: none; z-index: 5; display: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .win-pop.show, .crash-pop.show { animation-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="stage">
      <canvas id="scene"></canvas>
      <header>
        <button class="back" id="exitBtn" title="Back" aria-label="Exit to lounge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="brand">
          <span class="cas">CHAKRI.CASINO</span>
          <span class="title">CHICKEN <em>ROAD</em></span>
        </div>
        <div class="balance-pill"><span id="balance">0</span><span class="coin">₹</span></div>
        <button class="icon-btn" id="menuBtn" title="Menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </header>
      <div class="ticker">
        <span class="live">Live wins</span>
        <span class="online"><span class="dot"></span> Online: <b id="online">0</b></span>
      </div>
      <div class="win-row" id="liveWin"><span class="who" id="liveWho">—</span> <span class="amt" id="liveAmt"></span></div>
      <div class="lane-tag" id="laneTag">1.03x</div>
      <div class="win-pop" id="winPop">WIN!<span class="sub" id="winSub"></span></div>
      <div class="crash-pop" id="crashPop">HIT!</div>
    </div>

    <div class="dock">
      <div class="bet-row">
        <button class="minmax" id="minBtn">MIN</button>
        <div class="amount"><input id="betAmt" inputmode="numeric" value="20" /></div>
        <button class="minmax" id="maxBtn">MAX</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="diff-row">
        <button class="diff" id="diffBtn">Easy <span>▾</span></button>
        <div class="diff-menu" id="diffMenu"></div>
      </div>
      <div class="actions" id="actions">
        <button class="action play" id="playBtn">Play</button>
        <button class="action cashout" id="cashBtn" style="display:none">CASH OUT</button>
        <button class="action go" id="goBtn" style="display:none">GO</button>
      </div>
    </div>

    <div class="menu" id="menu">
      <div class="box">
        <h2>Chicken Road</h2>
        <div class="toggle-row">Sound <button class="switch on" id="soundSw"><i></i></button></div>
        <div class="toggle-row">Music <button class="switch on" id="musicSw"><i></i></button></div>
        <button class="link" id="rulesBtn">How to play</button>
        <button class="link" id="homeBtn">Back to home</button>
        <div class="powered">Powered by Chakri.Casino</div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <script src="engine.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
