<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 112" role="img" aria-labelledby="title" data-flight-profile="side-view">
  <title id="title">Red vintage Aviator aircraft</title>
  <defs>
    <linearGradient id="craft-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4864"/>
      <stop offset="0.5" stop-color="#e11942"/>
      <stop offset="1" stop-color="#af1330"/>
    </linearGradient>
    <linearGradient id="craft-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3163a"/>
      <stop offset="1" stop-color="#9c112b"/>
    </linearGradient>
  </defs>

  <!-- Vertical tail fin -->
  <path fill="#c1132f" d="M18 40 44 58 44 62 30 62 12 47Z"/>
  <!-- Horizontal stabiliser -->
  <path fill="#e11942" d="M20 60 58 60 50 71 30 71Z"/>

  <!-- Landing gear -->
  <path stroke="#0e1116" stroke-width="4" stroke-linecap="round" d="M168 72 178 92M150 74 140 92"/>
  <circle cx="180" cy="93" r="8" fill="#0e1116"/>
  <circle cx="180" cy="93" r="3.4" fill="#42474f"/>
  <circle cx="138" cy="93" r="8" fill="#0e1116"/>
  <circle cx="138" cy="93" r="3.4" fill="#42474f"/>

  <!-- Main wing -->
  <path fill="url(#craft-wing)" d="M112 63 196 63 224 82 150 82Z"/>

  <!-- Fuselage -->
  <path fill="url(#craft-body)" d="M40 59C68 47 120 43 172 45 214 46 244 49 260 56 263 57 263 61 260 62 244 69 214 72 172 73 120 74 68 71 40 60Z"/>

  <!-- Cockpit canopy -->
  <path fill="#0d1015" d="M150 49C170 47 190 48 202 53 190 57 170 57 152 56Z"/>
  <path fill="#79d0ff" d="M158 51C172 50 185 51 194 53 184 55 170 55 160 54Z" opacity="0.72"/>

  <!-- Nose spinner -->
  <path fill="#8d0f25" d="M256 54 273 60 256 66Z"/>

  <!-- Propeller (cheap CSS spin) -->
  <g id="propeller" transform-origin="273px 60px">
    <path fill="#111418" d="M270 28h6l-2 30h-2zM270 92h6l-2-30h-2z"/>
    <circle cx="273" cy="60" r="5" fill="#e11942"/>
    <circle cx="273" cy="60" r="2" fill="#111418"/>
  </g>

  <style>
    #propeller { animation: propeller-spin .19s linear infinite; }
    @keyframes propeller-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #propeller { animation: none; } }
  </style>
</svg>
