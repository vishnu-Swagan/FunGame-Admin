name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Reject undefined names in live game code
        run: python -m ruff check --select F821 routes_live.py server.py game_engines.py
      - name: Run backend tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        run: CI=true yarn test --watchAll=false
        env:
          CI: true
      - name: Build frontend
        run: yarn build
      - name: Run Aviator rendering tests
        run: CI=true npm --prefix aviator-reference test -- --watchAll=false --runInBand
