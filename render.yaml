# Render Blueprint for the existing production services.
#
# Auto-deploy is on for the linked main branch (On Commit). Keep Blueprint Auto
# Sync reviewed: a sync with autoDeployTrigger off would disable the dashboard
# setting. Service names stay historical so a sync updates production in place.
services:
  - type: web
    name: fungame-api
    runtime: docker
    autoDeployTrigger: commit
    branch: main
    # Preserve the live production capacity. A Blueprint sync treats this as an
    # instruction, so declaring free here would attempt an unsafe downgrade.
    plan: standard
    region: singapore              # near India players; MUST match the MongoDB Atlas region
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # The API answers under the brand too, so nothing a user or a support agent
    # ever reads says fungame. Renaming the Render SERVICE would change the same
    # hostname but breaks every already-built client the moment it takes effect;
    # a custom domain adds a name without removing the old one.
    domains:
      - api.chakri.casino
    envVars:
      - key: MONGO_URL
        sync: false          # set in dashboard — MongoDB Atlas connection string
      - key: DB_NAME
        # NOT part of the rebrand. This is the live MongoDB database name — every
        # user, balance, bet and round lives in it. Renaming it points the API at
        # an empty database.
        value: fungame
      - key: JWT_SECRET
        sync: false          # set in dashboard — long random string
      - key: AVIATOR_RETURN_FACTOR
        sync: false          # private server-side probability configuration
      - key: CORS_ORIGINS
        # Both origins during the rename: the old host keeps working until the
        # service is renamed in the dashboard, and the new one works the moment
        # it is. Neither deploy has to wait for the other.
        # The custom domain is the origin the browser actually sends once DNS is
        # cut over; the .onrender.com hosts stay listed so nothing breaks during
        # the changeover and so a direct Render URL still works for debugging.
        value: "https://chakri.casino,https://www.chakri.casino,https://play.chakri.casino,https://mydgp.casino,https://www.mydgp.casino,https://chakri-casino.onrender.com,https://fungame-web.onrender.com"
      - key: APP_ENV
        value: production                            # production requires live-only account flows
      - key: REGISTRATION_MODE
        sync: false                                  # preserve the live PHONE_OTP rollout managed in Render
      - key: REGISTRATION_EMAIL_OTP_REQUIRED
        sync: false                                  # enable only after Telesign Verify email is ready
      - key: OTP_PEPPER
        sync: false                                  # secret used by persistent auth rate-limit hashes
      - key: OTP_EMAIL_ADAPTER
        sync: false                                  # preserve the existing production delivery setting
      - key: OTP_SMS_ADAPTER
        sync: false                                  # preserve the existing Telesign delivery setting
      - key: PLAYER_LOGIN_OTP_REQUIRED
        value: "true"                                # every normal player login completes with a fresh OTP
      - key: TELESIGN_CUSTOMER_ID
        sync: false                                  # Telesign account credential; configure in Render before enabling
      - key: TELESIGN_API_KEY
        sync: false                                  # secret; never commit or expose to the frontend
      - key: TELESIGN_PLAN
        sync: false                                  # account capability; preserve the value managed in Render
      - key: TELESIGN_INTELLIGENCE_MODE
        sync: false                                  # disabled/observe/enforce is an operator-controlled rollout
      - key: TELESIGN_PHONE_ID_MODE
        sync: false                                  # explicit paid-call gate; never change during a code migration
      - key: TELESIGN_CONTACT_ADDON_ENABLED
        sync: false                                  # preserve the already-reviewed account capability
      - key: TELESIGN_VERIFY_PLUS_ENABLED
        sync: false                                  # must match My Telesign; do not overwrite from source
      - key: TELESIGN_VERIFY_TEMPLATE
        sync: false                                  # optional approved multi-channel Verify API template name
      - key: TELESIGN_ENGAGEMENT_SMS_ENABLED
        sync: false                                  # requires sender/compliance/consent workflow
      - key: OTP_EXPOSE_DEV_CODE
        value: "false"
      - key: EMAIL_PROVIDER
        sync: false                                  # preserve the production provider selection
      # Financial rollout switches are source-controlled fail-closed. A stale
      # dashboard value must never make a release money-live accidentally.
      - key: REAL_MONEY_ENABLED
        value: "false"
      - key: DEPOSITS_ENABLED
        value: "false"
      - key: WITHDRAWALS_ENABLED
        value: "false"
      - key: AUTO_WITHDRAWALS_ENABLED
        value: "false"
      - key: FINANCIAL_GAME_WALLET_INTEGRATED
        value: "false"
      - key: REGULATORY_APPROVED
        value: "false"
      - key: WAGER_MISSIONS_ENABLED
        value: "false"
      - key: REFERRAL_REWARDS_ENABLED
        value: "false"
      - key: PROMOTIONS_GAME_WALLET_INTEGRATED
        value: "false"
      - key: WAGER_SETTLEMENT_FINALITY_CERTIFIED
        value: "false"
      - key: WAGER_SETTLEMENT_FINALITY_POLICY_VERSION
        value: ""
      - key: WAGER_SETTLEMENT_FINALITY_CERTIFIED_POLICY_VERSION
        value: ""
      - key: RANDOMIZED_REWARDS_LEGAL_APPROVED
        value: "false"
      - key: PROMOTIONS_PUBLIC_APP_ORIGIN
        value: "https://chakri.casino"
      - key: REFERRAL_RISK_PEPPER
        sync: false
      - key: LEGACY_CHIP_REQUESTS_ENABLED
        value: "false"
      # Versioned registration policy evidence. Public facts and hashes are
      # supplied in Render without being invented or copied from another site.
      - key: CURRENT_TERMS_VERSION
        sync: false
      - key: CURRENT_PRIVACY_VERSION
        sync: false
      - key: TERMS_PUBLIC_URL
        sync: false
      - key: PRIVACY_PUBLIC_URL
        sync: false
      - key: TERMS_EFFECTIVE_AT
        sync: false
      - key: PRIVACY_EFFECTIVE_AT
        sync: false
      - key: TERMS_CONTENT_SHA256
        sync: false
      - key: PRIVACY_CONTENT_SHA256
        sync: false
      - key: POLICY_EXPLICIT_VERSION_ACK_REQUIRED
        sync: false
      - key: PAYMENTS_V2_ENABLED
        value: "false"
      - key: PAYMENT_GATEWAY_ADMIN_ENABLED
        value: "true"                       # operator config surface; code also defaults on. Does not move money.
      - key: PAYMENT_LIVE_MODE_ALLOWED
        value: "false"
      # Deposit-only hosted UPI has its own narrow gate. Keep it false in Git;
      # enabling it is a separate, explicitly approved Render dashboard change
      # after the mocked checks and one live canary in docs/payments/SGPAY24-RUNBOOK.md.
      - key: UPI_CHIP_PURCHASES_ENABLED
        value: "false"
      - key: UPI_CHIPS_PER_INR
        sync: false          # required reviewed integer rate; each hosted order snapshots it
      - key: UPI_MAX_DAILY_DEPOSIT_PAISE
        sync: false          # ignored; code hardcodes ₹2,00,000 per IST day for every player
      - key: PAYMENT_CREDENTIALS_MASTER_KEY
        sync: false          # AES-GCM key; configure in Render secrets only
      - key: PAYMENT_WEBHOOK_PUBLIC_BASE_URL
        value: https://api.chakri.casino
      - key: PAYMENT_PROVIDER_ALLOWED_DOMAINS
        sync: false          # reviewed provider hosts used by Generic REST SSRF controls
      - key: PAYMENT_PROVIDER_CHECKOUT_ALLOWED_DOMAINS
        sync: false          # exact reviewed HTTPS hosts permitted for player checkout redirects
      - key: PAYMENT_PROVIDER
        sync: false          # set to sgpay24 in Render only; no runtime fallback exists
      - key: PAYMENT_PROVIDER_CONFIG_JSON
        sync: false          # approved endpoint and field mappings; never embed credential values
      - key: PAYMENT_RETURN_URL
        value: https://chakri.casino/wallet/deposit/return
      - key: CHIPS_PER_INR
        sync: false          # operator-reviewed integer conversion rate
      - key: MIN_DEPOSIT_PAISE
        sync: false
      - key: MAX_DEPOSIT_PAISE
        sync: false
      - key: MIN_WITHDRAWAL_PAISE
        value: "100000"     # INR 1,000
      - key: MIN_WITHDRAWAL_CHIPS
        sync: false
      - key: MAX_WITHDRAWAL_CHIPS
        sync: false
      - key: PAYOUT_DATA_ACTIVE_KEY_VERSION
        sync: false
      - key: PAYOUT_DATA_KEY_V1
        sync: false          # AES-GCM bank-data key; never expose or commit
      - key: PAYOUT_DATA_FINGERPRINT_KEY
        sync: false
      - key: FINANCIAL_ALLOWED_COUNTRIES
        sync: false          # reviewed ISO alpha-2 allow-list
      - key: SUPABASE_GAME_SETTLEMENT_ENABLED
        value: "false"
      - key: MIGRATION_EXPORT_ENABLED
        value: "false"
      - key: CRON_SECRET
        sync: false          # set in dashboard — the night job's shared key
      - key: SETTLEMENT_TZ
        # The operator's day. Every gaming day, every commission period and the
        # night job's own schedule are derived from this one value, so the books
        # cannot disagree with the clock that settles them.
        value: Europe/London

  # Static frontend (CDN-served, always on). Built by Render; serves the PWA
  # that PWABuilder wraps into the Android APK.
  - type: web
    name: Chakri.Casino-web
    runtime: static
    autoDeployTrigger: commit
    branch: main
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile --network-timeout 600000 && yarn build
    staticPublishPath: build
    # Custom domains are intentionally omitted. chakri.casino is owned by the
    # separate public Sites project, crm.chakri.casino remains the rollback CRM,
    # and play.chakri.casino must be connected only as a reviewed DNS change.
    envVars:
      - key: REACT_APP_BACKEND_URL
        # Keep new builds and installed PWAs pinned to the branded production
        # origin.  The historical Render hostname no longer serves this API.
        value: https://api.chakri.casino
      - key: REACT_APP_LEGACY_CHIP_REQUESTS_ENABLED
        value: "false"
      - key: REACT_APP_LEGAL_POLICY_STATUS
        sync: false
      - key: REACT_APP_LEGAL_POLICY_VERSION
        sync: false
      - key: REACT_APP_TERMS_VERSION
        sync: false
      - key: REACT_APP_PRIVACY_VERSION
        sync: false
      - key: REACT_APP_LEGAL_POLICY_EFFECTIVE_DATE
        sync: false
      - key: REACT_APP_OPERATOR_LEGAL_NAME
        sync: false
      - key: REACT_APP_OPERATOR_COMPANY_NUMBER
        sync: false
      - key: REACT_APP_OPERATOR_REGISTERED_OFFICE
        sync: false
      - key: REACT_APP_OPERATOR_REGULATOR_NAME
        sync: false
      - key: REACT_APP_OPERATOR_LICENCE_NUMBER
        sync: false
      - key: REACT_APP_OPERATOR_LICENCE_URL
        sync: false
      - key: REACT_APP_OPERATOR_SUPPORT_EMAIL
        sync: false
      - key: REACT_APP_OPERATOR_PRIVACY_EMAIL
        sync: false
      - key: REACT_APP_OPERATOR_COMPLAINTS_EMAIL
        sync: false
      - key: REACT_APP_OPERATOR_ADR_NAME
        sync: false
      - key: REACT_APP_OPERATOR_ADR_URL
        sync: false
      - key: REACT_APP_OPERATOR_GOVERNING_LAW
        sync: false
      - key: GENERATE_SOURCEMAP
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /aviator-live/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        # Aviator is served by this same static site and mounted in the player
        # shell as an iframe. SAMEORIGIN keeps third-party framing blocked while
        # allowing that first-party game surface to render.
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()

# The nightly settlement cron is intentionally not managed by this Blueprint.
# Render does not allow a free cron plan, and the current backend image does not
# install curl. Reintroduce it only after a paid plan, spend ceiling, command,
# idempotency dry run, and rollback owner are approved. Removing a resource from
# a Blueprint never deletes an existing Render service.
