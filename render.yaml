# Render Blueprint — deploys the Chakri.Casino FastAPI backend as a Docker web service.
# 1. Push this repo to GitHub (already done).
# 2. On render.com: New + > Blueprint > pick this repo. Render reads this file.
# 3. Fill in MONGO_URL (from MongoDB Atlas) and JWT_SECRET when prompted.
services:
  - type: web
    name: chakri-casino-api
    runtime: docker
    # Declared explicitly. The static site was picking up every push while this
    # service sat on old code, which is invisible from outside — the API answers
    # perfectly well, it is just answering with a build from before the change.
    autoDeploy: true
    branch: main
    plan: free
    region: singapore              # near India players; MUST match the MongoDB Atlas region
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # The API answers under the brand too, so nothing a user or a support agent
    # ever reads says fungame. Renaming the Render SERVICE would change the same
    # hostname but breaks every already-built client the moment it takes effect;
    # a custom domain adds a name without removing the old one.
    domains:
      - api.chakri.casino
    envVars:
      - key: MONGO_URL
        sync: false          # set in dashboard — MongoDB Atlas connection string
      - key: DB_NAME
        # NOT part of the rebrand. This is the live MongoDB database name — every
        # user, balance, bet and round lives in it. Renaming it points the API at
        # an empty database.
        value: fungame
      - key: JWT_SECRET
        sync: false          # set in dashboard — long random string
      - key: AVIATOR_RETURN_FACTOR
        sync: false          # private server-side probability configuration
      - key: CORS_ORIGINS
        # Both origins during the rename: the old host keeps working until the
        # service is renamed in the dashboard, and the new one works the moment
        # it is. Neither deploy has to wait for the other.
        # The custom domain is the origin the browser actually sends once DNS is
        # cut over; the .onrender.com hosts stay listed so nothing breaks during
        # the changeover and so a direct Render URL still works for debugging.
        value: "https://chakri.casino,https://www.chakri.casino,https://mydgp.casino,https://www.mydgp.casino,https://chakri-casino.onrender.com,https://fungame-web.onrender.com"
      - key: APP_ENV
        value: production                            # production requires live-only account flows
      - key: EMAIL_PROVIDER
        value: disabled                              # configure resend, sendgrid, or smtp before enabling recovery email
      - key: CRON_SECRET
        sync: false          # set in dashboard — the night job's shared key
      - key: SETTLEMENT_TZ
        # The operator's day. Every gaming day, every commission period and the
        # night job's own schedule are derived from this one value, so the books
        # cannot disagree with the clock that settles them.
        value: Europe/London

  # Static frontend (CDN-served, always on). Built by Render; serves the PWA
  # that PWABuilder wraps into the Android APK.
  - type: web
    name: chakri-casino
    runtime: static
    autoDeploy: true
    branch: main
    rootDir: frontend
    buildCommand: yarn install --network-timeout 600000 && yarn build
    staticPublishPath: build
    # Declared here rather than clicked into the dashboard, so the domain is part
    # of the repo and survives a service being recreated. Render still has to see
    # the matching DNS records at the registrar before it will issue a
    # certificate — this side only claims the names.
    domains:
      - chakri.casino
      - www.chakri.casino
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://chakri-casino-api.onrender.com
      - key: GENERATE_SOURCEMAP
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()

  # The night run: aggregate yesterday's revenue, settle commission, raise
  # payouts. 02:00 Europe/London — Render schedules in UTC, so this is 01:00 UTC
  # and drifts an hour across BST. That is deliberate and harmless: the job
  # settles a NAMED day rather than "the last 24 hours", and every step is
  # idempotent, so firing early, late or twice changes nothing.
  - type: cron
    name: chakri-casino-night
    runtime: docker
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 1 * * *"
    dockerCommand: >-
      sh -c "curl -sS -X POST -H \"x-cron-key: $CRON_SECRET\"
      $API_BASE/api/admin/cron/night -w '\n%{http_code}\n' --fail-with-body"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: API_BASE
        value: https://chakri-casino-api.onrender.com
